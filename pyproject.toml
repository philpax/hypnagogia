[project]
name = "localworld"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "world_engine @ git+https://github.com/Wayfarer-Labs/world_engine.git",
    "pygame",
    "huggingface_hub[hf_xet]",
    "triton-windows==3.5.1.post23; sys_platform == 'win32'",
    "triton>=3.5.1; sys_platform == 'linux'",
    "comfy-script[default]",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-test"
url = "https://download.pytorch.org/whl/test/cu128"

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu128"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
